# We operate a single festival at a time, so the current festival is set here.
# This is used for the public site and for some internal queries. It must be
# set to a valid festival name from the database.
current_festival:   'TestFestival'

# IMPORTANT: Set testing to 1 to disable HTTPS requirement for testing. Set it to 0 in production.
testing:            1

# A list of classes which will not auto-create upon database
# loading. Good for maintaining some control over typos.
protected_classes: []
#  - Company
#  - Product
#  - ProductStyle
#  - ProductCategory
#  - Currency
#  - CompanyRegion
#  - ContactType
#  - ContainerMeasure
#  - ContainerSize
#  - Country
#  - ProductCharacteristicType
#  - SaleVolume
#  - TelephoneType
#  - Festival
#  - FestivalProduct
#  - Cask
#  - CaskManagement
#  - Gyle
#  - StillageLocation
#  - BayPosition
#  - OrderBatch
#  - ProductOrder

# This section controls which departments are uploaded to the CBF public
# festival site, and how the upload is performed. The beerfestdb_uri should
# point to the internal URI of the beerfestdb web application, and the
# public_site_upload_uri should be set to the URI where the public festival
# site can receive uploads. The public_festival_tag identifies the festival
# for the public site.
status_query:
  departments:
    - beer
    - foreign beer
    - cider
    - apple juice
    - perry
    - wine
    - mead
  beerfestdb_uri:          'http://localhost:3000'
  public_site_upload_uri:  'file://localhost/www/data/push'
  public_festival_tag:      test

# Indicate which departments are using the database to manage stock control
# measurements (i.e., dip values). This is used to determine which products
# should have stock control measurements uploaded to the public festival site
stock_control_departments:
  - beer

# Default currency and sale volume measures. These values must also be
# entered into the currency.currency_code and
# sale_volume.sale_volume_description database columns.
#default_currency:    GBP
#default_sale_volume: pint

# Configuration options specific to generation of a OpenOffice beer listing.
OODoc:

  # The named styles below must be defined in the ODT template document used.
  styles:
    bar_name:         'Bar Name'
    beer_name:        'Beer'
    beer_notes:       'Tasting Notes'
    brewery_name:     'Brewery'
    brewery_location: 'Brewery Location'

  dump_tasting_notes: 1

###############################################################################
# The following configs should not be changed unless you know what you're doing:

# Support the reverse proxy setup used by kubernetes and docker-compose deployments,
# by prepending a base path to all generated URLs. This should match the base path
# used in the reverse proxy configuration (e.g. in the nginx config for the
# beerfestdb-nginx-service in the k8s deployment).
base_path:          '/app'

# Main database configuration.
# For production deployments, make sure to change the database password here,
# and in the database initialization SQL script db/create_dbuser_account.sql
Model::DB:
  connect_info:
    - 'DBI:MariaDB:database=beerfestdb;host=mysql;port=3306'
    - 'beerfestdb'
    - 'vent&T4p'
    - RaiseError: 1
      AutoCommit: 1
      limit_dialect: 'LimitXY' # until MariaDB is fully supported by DBIC, see https://github.com/Perl5/DBIx-Class/pull/151

# OIDC provider configuration for authentication. This is required if you want 
# to use the OpenID Connect plugin for authentication in the web application. 
# Adjust the issuer URL, client configuration, and Redis store settings as
# needed for your environment. The tools dashboard client configuration is 
# included as an example and should be updated with appropriate values for your deployment.
Plugin::OpenIDConnect:
  issuer:
    url: 'https://localhost:3000'
    private_key_file: '/path/to/beerfestdb/keys/private.pem'
    public_key_file: '/path/to/beerfestdb/keys/public.pem'
    key_id: 'my-key-1'
  clients:
    'dashboard':
       client_secret: 'my-secret'
       redirect_uris: 'http://localhost:8501/oauth2callback'
       post_logout_redirect_uris: 'http://localhost:8501/oauth2callback'
  # Optional Redis store configuration for OpenID Connect session management. Likely
  # Redis store for OpenID Connect session management - required for multi-worker
  # FastCGI deployments so auth codes are shared across all worker processes.
  store_class: 'Catalyst::Plugin::OpenIDConnect::Utils::Store::Redis'
  store_args:
    server: 'redis:6379'
    prefix: 'oidc:beerfestdb:'
    code_ttl: 600

Plugin::CSRFToken:
  max_age: 3600  # Token lifespan in seconds
  auto_check: 1
  default_secret: 'a very long and secret string that should be overridden in production'

# Email configuration for password reset messages.
email:
  # Default settings will attempt to use local SMTP server without authentication.
  from_address: 'beerfestdb@example.com'
  smtp_host:    'localhost'
  smtp_port:    25 # Default to standard SMTP port. Set to e.g. 465 for SMTP with SSL/TLS
#  smtp_ssl:     0  # Set to 1 to use SSL/TLS for SMTP connection, 0 for unencrypted.
#  smtp_user:    'smtp_account_username'
#  smtp_pass:    'XXXXX'

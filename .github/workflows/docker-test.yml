name: Docker Image Test Build

on:
  pull_request:
    branches: 
      - "cbf-production"
      - "*-feature-branch"

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag tfrayner/beerfestdb:testing

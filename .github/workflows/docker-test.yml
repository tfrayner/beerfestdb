name: Docker Image Test Build

on:
  pull_request:
    branches: 
      - "cbf-production"
      - "*-feature-branch"

permissions:
  contents: read

jobs:

  r-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        working-directory: R/BeerFestDB
        extra-packages: any::testthat, any::devtools

    - name: Run R package tests
      working-directory: R/BeerFestDB
      run: Rscript -e "devtools::test(stop_on_failure = TRUE)"

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag tfrayner/beerfestdb:testing

services:
  mysql:
    image: 'mysql:5.7'
    volumes: 
      - 'beerfestdb_mysql:/var/lib/mysql'
      - '../db:/docker-entrypoint-initdb.d'
    env_file: 
      - '../.mysql_env'
    expose:
      - 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u beerfestdb --password='vent&T4p' --silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  redis:
    image: 'redis:latest'
    expose:
      - 6379

  app:
    image: 'tfrayner/beerfestdb:latest'
    user: nobody
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - '../.app_env'
    volumes:
      - '../:/usr/src/BeerFestDB'
      - './beerfestdb_web_docker.yml:/usr/src/BeerFestDB/beerfestdb_web.yml:ro'
    command: >
            beerfestdb_web_fastcgi.pl -l :3000 -n 5 -e
    expose: 
      - 3000

  web:
    image: 'nginx:1.15.7-perl'
    depends_on: 
      - 'app'
    ports:
      - '8443:8443'
      - '8080:80'
    volumes:
      - '../docker-compose/nginx/beerfestdb.conf:/etc/nginx/conf.d/default.conf'
      - '../docker-compose/ssl:/etc/nginx/ssl:ro'

  streamlit-dashboard:
    image: 'tfrayner/beerfestdb-dashboard:latest'
    build:
      context: '../tool_dashboard'
      dockerfile: 'Dockerfile'
    expose:
      - 8501
    environment:
      # Allow Streamlit to verify SSL certificates using the custom CA certificate
      - SSL_CERT_FILE=/etc/ssl/custom/cert.pem
      # Tell Streamlit the external address so OIDC static asset URLs are correct.
      # Without these, Streamlit defaults to 'localhost' in generated URLs.
      - STREAMLIT_BROWSER_SERVER_ADDRESS=titus.local
      - STREAMLIT_BROWSER_SERVER_PORT=8444
    volumes:
      - './beerfestdb_web_docker.yml:/beerfestdb_web.yml:ro'
      - '../docker-compose/ssl/cert.pem:/etc/ssl/custom/cert.pem:ro'
      - '../docker-compose/dashboard-config:/app/.streamlit:ro'

  dashboard-proxy:
    image: 'nginx:1.15.7-alpine'
    depends_on:
      - 'streamlit-dashboard'
    ports:
      - '8444:443'
      - '8081:80'
    volumes:
      - '../docker-compose/nginx/dashboard.conf:/etc/nginx/conf.d/default.conf'
      - '../docker-compose/ssl:/etc/nginx/ssl:ro'

volumes:
  'beerfestdb_mysql': {}

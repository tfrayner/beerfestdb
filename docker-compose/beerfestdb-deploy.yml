version: '3'

services:
  mysql:
    image: 'mysql:5.7'
    volumes: 
      - 'beerfestdb_mysql:/var/lib/mysql'
      - './db:/docker-entrypoint-initdb.d'
    env_file: 
      - '.mysql_env'
    expose:
      - 3306

  app:
    image: 'tfrayner/beerfestdb:1.1'
    user: nobody
    env_file:
      - '.app_env'
    volumes:
      - './:/usr/src/BeerFestDB'
    command: >
            beerfestdb_web_fastcgi.pl -l :3000 -n 5 -e
    expose: 
      - 3000

  web:
    image: 'nginx:1.15.7-perl'
    depends_on: 
      - 'app'
    ports:
      - '8443:443'
      - '8080:80'
    volumes:
      - './docker-compose/nginx/beerfestdb.conf:/etc/nginx/conf.d/default.conf'
      - './docker-compose/ssl:/etc/nginx/ssl:ro'

  streamlit-dashboard:
    image: 'tfrayner/beerfestdb-dashboard:latest'
    build:
      context: './tool_dashboard'
      dockerfile: 'Dockerfile'
    expose:
      - 8501
    volumes:
      - './tool_dashboard:/app'

  dashboard-proxy:
    image: 'nginx:1.15.7-alpine'
    depends_on:
      - 'streamlit-dashboard'
    ports:
      - '8444:443'
      - '8081:80'
    volumes:
      - './docker-compose/nginx/dashboard.conf:/etc/nginx/conf.d/default.conf'
      - './docker-compose/ssl:/etc/nginx/ssl:ro'
      - './docker-compose/dashboard-config:/app/.streamlit:ro'

volumes:
  'beerfestdb_mysql': {}

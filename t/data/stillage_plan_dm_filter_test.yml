---
# Test YAML config with a dispense_methods filter that excludes the test
# fixtures (which use container_size_id=1 / firkin / dispense_method 'cask').
# Used by t/stillage_planner.t to verify the dispense method filter works.

margin: 0.10

dispense_methods:
  - key keg

container_widths:
  firkin: 0.45
  kilderkin: 0.58

stillages:
  - description: PlannerTestStillage
    bays:
      - number: 1
        positions:
          - bay_position: Top Front
            width: 4.0
          - bay_position: Bottom Front
            width: 3.0
      - number: 2
        positions:
          - bay_position: Top Front
            width: 2.0

weights:
  alphabetical: 10
  proximity: 5
  deck: 20
  sor_deck_multiplier: 0.1

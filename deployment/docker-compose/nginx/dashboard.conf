# Map to handle WebSocket Connection header correctly
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - note: http2 is intentionally omitted; it does not support
# the WebSocket Upgrade mechanism required by Streamlit's /_stcore/stream.
server {
    listen 443 ssl;
    server_name _;

    # SSL certificate configuration - see docker-compose.yml for volume mounts
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;


    # Proxy all traffic (HTTP and WebSocket) to Streamlit
    location / {
        proxy_pass http://streamlit-dashboard:8501;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket upgrade support (required for /_stcore/stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts - WebSocket connections must stay open
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

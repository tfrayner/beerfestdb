[connections.cbf]
dialect = "mysql"
host = "mysql"
port = 3306
database = "beerfestdb"
username = "beerfestdb"
password = "vent&T4p"

[auth]
# redirect_uri must be the browser-accessible external URL
redirect_uri = "https://titus.local:3001/dashboard/oauth2callback"
cookie_secret = "change this text to a unique string"

client_id = "dashboard"
client_secret = "change this text to a unique string matching client_secret in other config file"

# This server address must be accessible from within the k8s/docker-compose cluster. 
# For this reason you may find you need to use the raw IP address. Bear in mind that
# the SSL certificates must be generated with the server DNS and/or IP address attached.
#    In this example, DNS entry for 'titus.local' is '10.0.1.205':
server_metadata_url = "https://10.0.1.205:3001/app/.well-known/openid-configuration"

[app]
# Inactivity timeout in minutes before the user is automatically logged out.
inactivity_timeout_minutes = 60
